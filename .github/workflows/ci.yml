name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink needs the full history to resolve the commit.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # Not global-json-file: global.json asks for 10.0.0, which is a band rather than a
          # released SDK, and setup-dotnet resolves it by trying to install that exact
          # version. rollForward settles it locally; it does not help the installer.
          dotnet-version: '10.0.x' 

      - name: Restore
        run: dotnet restore IQOne.Zero.slnx

      - name: Build
        run: dotnet build IQOne.Zero.slnx -c Release --no-restore

      - name: Test
        run: dotnet test IQOne.Zero.slnx -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Pack
        run: dotnet pack IQOne.Zero.slnx -c Release --no-build

      # Proves what a consumer actually gets: the packages are installed from the
      # produced .nupkg files, not from project references.
      # Both target frameworks the packages claim. The test projects are all net10.0, so a
      # net8-only failure in lib/net8.0 would otherwise ship without anyone compiling it.
      - name: Verify packages against a real consumer (net10.0)
        run: ./eng/verify-consumer.sh

      - name: Verify packages against a real consumer (net8.0)
        run: ./eng/verify-consumer.sh
        env:
          ZERO_VERIFY_TFM: net8.0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  # Trusted Publishing: no API key is stored anywhere. The job proves who it is with the
  # workflow's OIDC identity, and nuget.org hands back a key that lives for minutes.
  #
  # A stored key is a credential that outlives the reason it was created: it sits in
  # repository secrets, it works from anywhere, and nothing expires it. This one cannot be
  # copied out and reused, because by the time anyone could it has gone.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget

    permissions:
      # The whole mechanism. Without it the login step has no identity to present.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # Not global-json-file: global.json asks for 10.0.0, which is a band rather than a
          # released SDK, and setup-dotnet resolves it by trying to install that exact
          # version. rollForward settles it locally; it does not help the installer.
          dotnet-version: '10.0.x' 

      - name: Pack release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack IQOne.Zero.slnx -c Release -p:VersionPrefix="$VERSION" -p:VersionSuffix=

      # Exchanges this run's OIDC token for a short-lived key and exports it as
      # NUGET_API_KEY. Nothing to store, nothing to rotate, nothing to leak.
      - name: Exchange the workflow identity for a temporary key
        uses: NuGet/login@v1
        id: login
        with:
          # The account that CREATED the policy, not the account that owns the packages.
          # nuget.org resolves this with GetPoliciesCreatedByUser(FindByUsername(user)), and
          # a policy carries CreatedBy and PackageOwner as two separate fields. The policy
          # here is owned by IQOne but was created by keremcanaktas, so IQOne matches nothing.
          user: keremcanaktas

      - name: Push to nuget.org
        run: |
          # --skip-duplicate so a retry after a partial failure finishes the job rather than
          # stopping on the packages that already landed. nuget.org never lets a version be
          # replaced, so a half-finished push must be completable.
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
