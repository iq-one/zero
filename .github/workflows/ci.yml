name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SourceLink needs the full history to resolve the commit.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore IQOne.Zero.slnx

      - name: Build
        run: dotnet build IQOne.Zero.slnx -c Release --no-restore

      - name: Test
        run: dotnet test IQOne.Zero.slnx -c Release --no-build --logger "trx;LogFileName=test.trx"

      - name: Pack
        run: dotnet pack IQOne.Zero.slnx -c Release --no-build

      # Proves what a consumer actually gets: the packages are installed from the
      # produced .nupkg files, not from project references.
      - name: Verify packages against a real consumer
        run: ./eng/verify-consumer.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack IQOne.Zero.slnx -c Release -p:VersionPrefix="$VERSION" -p:VersionSuffix=

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate
